[package]
name = "afkconvoy"
description = "A fleet of AFK coding agents that works a GitHub backlog"
version.workspace = true
edition.workspace = true
repository.workspace = true
# One test program, tests/main.rs, not one a file: see there.
autotests = false

[dependencies]
afkconvoy-core = { path = "../core" }
anyhow = "1"
gethostname = "1"
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "cli"
path = "tests/main.rs"
