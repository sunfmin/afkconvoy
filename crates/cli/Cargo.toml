[package]
name = "afkconvoy"
description = "A fleet of AFK coding agents that works a GitHub backlog"
version.workspace = true
edition.workspace = true
repository.workspace = true
# One test program, tests/main.rs, not one a file: see there.
autotests = false

[dependencies]
afkconvoy-core = { path = "../core" }
afkconvoy-daybook = { path = "../daybook" }
afkconvoy-gate = { path = "../gate" }
afkconvoy-host-kit = { path = "../host-kit" }
afkconvoy-host-reading = { path = "../host-reading" }
afkconvoy-landing = { path = "../landing" }
agent-help = { git = "https://github.com/sunfmin/agent-cli" }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
gethostname = "1"
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
zstd = "0.13"
toml = "0.8"
signal-hook = "0.3"
# A rebuild's read keeps each issue's stage history beside the team whose
# workflow it borrows (`stage::Flows`).
self_cell = "1"
# The host's one database (`host_db`): its candidate chains first, the rest of
# its local state after them. Bundled, so no system library is assumed.
rusqlite = { version = "=0.32.1", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
# What a process wrote to disk and where it works, as the kernel says them
# (`proc_pid_rusage`, `proc_pidinfo`), and the user's id (`getuid`).
libc = "0.2"

[dev-dependencies]
# The one bound on a test's wait for an event (sunfmin/control#1183).
afkconvoy-patience = { path = "../patience" }
tempfile = "3"

[[test]]
name = "cli"
path = "tests/main.rs"
