# Required loader services are additive to each plugin's own dependencies.
# No TUI or agent loop can mount before the guard has installed its listeners.
- id: agent-loop
  inject: [afkconvoyGuard]
- id: dsh-tui
  inject: [afkconvoyGuard]
- id: approval
  config:
    policy: never
- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.env.AFKCONVOY_WORKTREE
- insert:
    - id: afkconvoy
      name: '@AFKCONVOY_DSH_PLUGIN@'
