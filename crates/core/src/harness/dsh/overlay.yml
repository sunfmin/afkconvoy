# Required loader services are additive to each plugin's own dependencies.
# No TUI or agent loop can mount before the guard has installed its listeners.
- id: agent-loop
  inject: [afkconvoyGuard]
- id: dsh-tui
  inject: [afkconvoyGuard]
# The TUI disables this base row in favor of preset discovery. Restore it
# with explicit roots, role first, under a distinct provider name. User
# skills live outside default discovery so preset providers cannot shadow
# a role's skill in their own scope. Equal-rank roots keep list order.
- id: skill-filesystem
  disabled: false
  config:
    providerName: afkconvoy-role
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.cwd() + '/.claude/skills', (process.env.AFKCONVOY_DSH_KEPT || process.env.DSH_HOME) + '/host-skills', (process.env.AFKCONVOY_DSH_KEPT || process.env.DSH_HOME) + '/host-agents-skills']"
- insert:
    - id: afkconvoy
      name: '@AFKCONVOY_DSH_PLUGIN@'
