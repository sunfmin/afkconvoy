[package]
name = "afkconvoy-core"
description = "afkconvoy's decisions: pure functions, checked by Flux (docs/adr/0007)"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Refinement attributes; they expand to nothing under a plain `cargo build`.
flux-rs = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
# Flux's refinements of the standard library, at the same revision: without
# them a `Vec` has no length Flux knows of, and an index into one goes unchecked.
# Both are empty under a plain `cargo build`.
flux-alloc = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
flux-core = { git = "https://github.com/flux-rs/flux.git", rev = "b2f3e31e17727ffe08c2efee1e7aa0bc4f0a66f9" }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_yaml = "0.9"

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

# The checker ../../verify.sh runs, beside the Flux revision above that
# `cargo-flux` is built from. It refuses any other: each value is what the tool
# reports about itself, to `fixpoint --version` and to `z3 --version`.
# `./verify.sh install` installs these, and builds fixpoint with the stack
# release named last, which nothing checks once fixpoint is built.
[package.metadata.checker]
fixpoint = "0.9.6.3.8 (684d0829c19fbee83b892c9f5e20c2598897297c)"
z3 = "5.1.0"
stack = "3.11.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
