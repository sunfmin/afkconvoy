[package]
name = "afkconvoy-core"
description = "afkconvoy's decisions: pure functions, checked by Flux (docs/adr/0007)"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# Flux's attributes and refinements of the standard library (../../Cargo.toml).
flux-rs.workspace = true
flux-alloc.workspace = true
flux-core.workspace = true
afkconvoy-harness = { path = "../harness" }
serde.workspace = true
serde_json.workspace = true
toml = "0.8"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_yaml = "0.9"

# `cargo flux` (through ../../verify.sh) checks every refinement in this crate.
[package.metadata.flux]
enabled = true
check_overflow = "strict"

# The checker ../../verify.sh runs, beside the Flux revision above that
# `cargo-flux` is built from. It refuses any other: each value is what the tool
# reports about itself, to `fixpoint --version` and to `z3 --version`.
# `./verify.sh install` installs these, and builds fixpoint with the stack
# release named last, which nothing checks once fixpoint is built.
[package.metadata.checker]
fixpoint = "0.9.6.3.8 (684d0829c19fbee83b892c9f5e20c2598897297c)"
z3 = "5.1.0"
stack = "3.11.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(flux)'] }
