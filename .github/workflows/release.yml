# A release: pushing the tag v<version> builds `afkconvoy` on stable Rust for
# Apple Silicon and Intel macOS and publishes both, with the Homebrew formula
# that installs them. Every step is `packaging/release.sh`, so it can be run
# by hand as well.
#
# The formula goes to the tap (sunfmin/homebrew-tap) when the repository has
# the secret HOMEBREW_TAP_TOKEN — a token that may push there. Without it the
# formula is only attached to the release, to be committed to the tap by hand.

name: release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: The tag is the version
        run: packaging/release.sh check "$GITHUB_REF_NAME"
      - name: Build
        run: cargo build --release --locked -p afkconvoy --target ${{ matrix.target }}
      - name: Package
        run: packaging/release.sh package ${{ matrix.target }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: afkconvoy-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Formula
        run: |
          packaging/release.sh formula > dist/afkconvoy.rb
          ruby -c dist/afkconvoy.rb
          (cd dist && shasum -a 256 *.tar.gz > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            dist/*.tar.gz dist/SHA256SUMS dist/afkconvoy.rb
      - name: Tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::No HOMEBREW_TAP_TOKEN: commit the release's afkconvoy.rb to sunfmin/homebrew-tap as Formula/afkconvoy.rb by hand."
            exit 0
          fi
          version=$(packaging/release.sh version)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/sunfmin/homebrew-tap.git" tap
          cp dist/afkconvoy.rb tap/Formula/afkconvoy.rb
          cd tap
          git add Formula/afkconvoy.rb
          git -c user.name=afkconvoy-release -c user.email=afkconvoy-release@users.noreply.github.com \
            commit -m "afkconvoy $version"
          git push origin HEAD
