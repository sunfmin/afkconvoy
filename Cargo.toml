[workspace]
resolver = "3"
members = ["crates/harness", "crates/gate", "crates/landing", "crates/core", "crates/cli"]

[workspace.package]
version = "0.5.64"
edition = "2024"
repository = "https://github.com/sunfmin/afkconvoy"

[workspace.dependencies]
# Refinement attributes, which expand to nothing under a plain `cargo build`,
# and Flux's refinements of the standard library, at the same revision: without
# them a `Vec` has no length Flux knows of, and an index into one goes
# unchecked. The revision is the one ./verify.sh's Flux, Homebrew's
# sunfmin/tap/flux-toolchain, was built from while its Flux checks this tree;
# `brew info sunfmin/tap/flux-toolchain` names it. Every crate Flux checks
# names these (docs/adr/0007).
flux-rs = { git = "https://github.com/flux-rs/flux.git", rev = "ef6af17f647cf98c860e18e90c36d1f1b69849ff" }
flux-alloc = { git = "https://github.com/flux-rs/flux.git", rev = "ef6af17f647cf98c860e18e90c36d1f1b69849ff" }
flux-core = { git = "https://github.com/flux-rs/flux.git", rev = "ef6af17f647cf98c860e18e90c36d1f1b69849ff" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# No debug info for dependencies: a backtrace still names this workspace's
# lines, and what is built, written and linked shrinks. Dependencies are
# optimised: every test runs the CLI, which spends much of its time in them
# (parsing JSON, YAML and TOML), and the suite took 263s instead of 319s, 6 at
# a time. From no target/ the gate's steps before the tests take about 8s more
# (Flux the most), and optimising them for the test profile alone saved none of
# it: the build of the tests then paid it. This workspace's own crates are not
# optimised, so a change to them builds as fast as before; debug assertions and
# overflow checks stay on everywhere.
[profile.dev.package."*"]
debug = false
opt-level = 2
