[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.5.69"
edition = "2024"
repository = "https://github.com/sunfmin/afkconvoy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

# No debug info for dependencies: a backtrace still names this workspace's
# lines, and what is built, written and linked shrinks. Dependencies are
# optimised: every test runs the CLI, which spends much of its time in them
# (parsing JSON, YAML and TOML), and the suite took 263s instead of 319s, 6 at
# a time. From no target/ the gate's steps before the tests take about 8s more
# (Flux the most), and optimising them for the test profile alone saved none of
# it: the build of the tests then paid it. This workspace's own crates are not
# optimised, so a change to them builds as fast as before; debug assertions and
# overflow checks stay on everywhere.
[profile.dev.package."*"]
debug = false
opt-level = 2
