[workspace]
resolver = "3"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.5.19"
edition = "2024"
repository = "https://github.com/sunfmin/afkconvoy"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# No debug info for dependencies: a backtrace still names this workspace's
# lines, and what is built, written and linked shrinks.
[profile.dev.package."*"]
debug = false
