# The limit for one test, which ./gate.sh runs the tests under: a test still
# running after 240 seconds is ended and fails as TIMEOUT, by name. From 20
# seconds on it is reported SLOW, and the gate names it as it ends: a test
# that slows the gate is seen the day it lands.
#
# Measured on one host, 14 cores, warm build: the slowest test takes 24s with
# the host to itself and 79s with other gates' tests running beside it, as they
# ran before the gates queued. The limit is three times that.
#
# Six tests run at a time, not nextest's one per logical CPU: a test of the
# CLI starts processes by the dozen (the CLI itself, and the `git`, `gh` and
# `orca` it runs). This repo's gates run one at a time on a host, through
# `afkconvoy exclusive` (docs/agents/afkconvoy.md), but beside whatever else
# runs there outside that queue: other fleets' work, and the human's. Six at a
# time, the suite takes about the sum of its tests' times over six: a second
# taken off any test is a sixth of a second off the gate.
[profile.default]
slow-timeout = { period = "20s", terminate-after = 12 }
test-threads = 6

# The fast gate's tests (./gate.sh fast, docs/adr/0047): every test but those
# .config/slow-tests names, each of which took 2 seconds or more on the host
# the line was drawn on. A test still running after 6 seconds, three times the
# line, is ended and fails as TIMEOUT. The gate checks timeouts on a quiet
# host before recommending that a test be named slow.
[profile.fast]
slow-timeout = { period = "2s", terminate-after = 3 }
fail-fast = true

# Check a fast timeout alone against the 2-second line.
[profile.fast-check]
slow-timeout = { period = "2s", terminate-after = 1 }

# The slow gate's tests (./gate.sh slow): those .config/slow-tests names,
# under the default profile's limit for one test, twelve at a time. Each is a
# test of the CLI that spends most of its time waiting on the processes it
# starts, not running: six at a time kept about three of
# Offices-MacBook-Pro.local's 8 cores busy. There, its worlds running the
# real git and not Apple's shim (sunfmin/control#234), the slow gate took
# 665s at twelve where it had taken 1,157s at six (docs/gate-baseline.md);
# at sixteen a test that waits 30s for a candidate's transition ran out of it.
#
# It runs every one of its tests, past a failure (`fail-fast`): a round's
# slow gate takes twenty minutes, and the worker who fixes a red round
# (docs/adr/0048) is told every test it broke at once, not the first of them.
# On 2026-10-30 a round's slow gate stopped at its 274th test of 811.
#
# Each profile's count holds only where the gate is given no share of the
# host: `afkconvoy exclusive` says one as NEXTEST_TEST_THREADS, in cores, and
# ./gate.sh then runs two tests to each of those cores, in either gate
# (docs/adr/0077).
[profile.slow]
test-threads = 12
fail-fast = false
